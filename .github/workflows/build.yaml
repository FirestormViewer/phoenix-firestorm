name: Build

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches: ["master", "main", "release/*", "project/*"]
    tags: ["Second_Life*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            directory: build-vc170-64
          - os: ubuntu-24.04
            directory: build-linux-x86_64
    runs-on: ${{ matrix.os }}
    env:
      AUTOBUILD_ADDRSIZE: 64
      AUTOBUILD_CONFIGURATION: ReleaseFS_open
      AUTOBUILD_VSVER: "170"
      AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/.build-variables/variables
      AUTOBUILD_INSTALLABLE_CACHE: ${{ github.workspace }}/.autobuild-installables
      LL_SKIP_REQUIRE_SYSROOT: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set source build number
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse --is-shallow-repository)" != false ]]; then
            echo "Build numbering requires complete Git history" >&2
            exit 1
          fi
          build_revision=$(git rev-list --count HEAD)
          [[ "$build_revision" =~ ^[1-9][0-9]*$ ]]
          # Match BuildVersion.cmake's local Git fallback on both platforms.
          # Set revision too: it has precedence over AUTOBUILD_BUILD_ID.
          echo "revision=$build_revision" >> "$GITHUB_ENV"
          echo "AUTOBUILD_BUILD_ID=$build_revision" >> "$GITHUB_ENV"
          echo "Source $(git rev-parse HEAD): build $build_revision" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # The Vulkan prebuilt supplies headers/loader sources, not shader tools.
      - name: Cache shader compiler
        id: shader-compiler
        uses: actions/cache@v6
        with:
          path: .ci/glslang
          key: glslang-${{ runner.os }}-${{ runner.arch }}-8a85691a0740d390761a1008b4696f57facd02c4-v1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            gcc-14 g++-14 build-essential pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev libpulse-dev libssl-dev \
            libxinerama-dev libxrandr-dev libfontconfig1-dev libfreetype6-dev
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Checkout shader compiler
        if: steps.shader-compiler.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: KhronosGroup/glslang
          ref: 8a85691a0740d390761a1008b4696f57facd02c4 # 15.4.0
          path: .ci/glslang-source
          persist-credentials: false

      - name: Build shader compiler
        if: steps.shader-compiler.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake -S .ci/glslang-source -B .ci/glslang-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/.ci/glslang" \
            -DGLSLANG_TESTS=OFF -DENABLE_OPT=OFF -DENABLE_HLSL=OFF \
            -DENABLE_SPVREMAPPER=OFF -DGLSLANG_ENABLE_INSTALL=ON
          cmake --build .ci/glslang-build --config Release --parallel 3
          cmake --install .ci/glslang-build --config Release

      - name: Add shader compiler to PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.ci/glslang/bin" >> "$GITHUB_PATH"

      - name: Verify shader compiler
        shell: bash
        run: glslangValidator --version

      - name: Checkout locally qualified build variables
        uses: actions/checkout@v7
        with:
          repository: FirestormViewer/fs-build-variables
          ref: c17312d38377c003977cf5b6dcc83c6042eba194
          path: .build-variables
          persist-credentials: false

      - name: Install build dependencies
        run: python -m pip install autobuild==3.9.3 llsd

      - name: Check Linux installation scripts
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/test_linux_install_scripts.sh

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - uses: actions/cache@v6
        with:
          path: .autobuild-installables
          key: ${{ runner.os }}-64-ReleaseFS_open-${{ hashFiles('autobuild.xml') }}
          restore-keys: ${{ runner.os }}-64-ReleaseFS_open-

      - name: Configure local Release settings
        shell: bash
        env:
          BUILD_DIRECTORY: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          eval "$(autobuild source_environment -c ReleaseFS_open)"
          export LL_BUILD
          options=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            # The flags used by the successful local Release build.
            export LL_BUILD='/MD /O2 /Ob2 /std:c++20 /permissive- /Zc:wchar_t /Zi /GR /DLL_RELEASE=1 /DNDEBUG /D_SECURE_STL=0 /D_HAS_ITERATOR_DEBUGGING=0 /DWIN32 /D_WINDOWS /DLL_WINDOWS=1 /DUNICODE /D_UNICODE /DWINVER=0x0601 /D_WIN32_WINNT=0x0601 /DLL_OS_DRAGDROP_ENABLED=1 /DLIB_NDOF=1'
            options+=(-G 'Visual Studio 17 2022' -A x64 -DUSE_MESAZINK:BOOL=ON -DUSE_INNOSETUP:BOOL=ON)
          else
            options+=(-DUSE_MESAZINK:BOOL=OFF -DUSE_INNOSETUP:BOOL=OFF)
          fi
          cmake -S indra -B "$BUILD_DIRECTORY" "${options[@]}" \
            -DCMAKE_BUILD_TYPE:STRING=Release -DADDRESS_SIZE:STRING=64 \
            -DVIEWER_CHANNEL:STRING=Vulkanstorm-Release -DROOT_PROJECT_NAME:STRING=Firestorm \
            -DPYTHON_EXECUTABLE:FILEPATH="$(python -c 'import sys; print(sys.executable)')" \
            -DPACKAGE:BOOL=ON -DOPENSIM:BOOL=OFF -DINSTALL_PROPRIETARY:BOOL=OFF \
            -DUSE_KDU:BOOL=OFF -DUSE_SOLOUD:BOOL=ON \
            -DUSE_OPENAL:BOOL=OFF -DOPENAL:BOOL=OFF -DUSE_FMODSTUDIO:BOOL=OFF -DFMODSTUDIO:BOOL=OFF \
            -DUSE_AVX2_OPTIMIZATION:BOOL=ON -DUSE_AVX_OPTIMIZATION:BOOL=OFF -DUSE_LTO:BOOL=ON \
            -DUSE_PRECOMPILED_HEADERS:BOOL=ON -DUSE_DISCORD:BOOL=OFF -DUSE_BUGSPLAT:BOOL=OFF \
            -DUSE_TRACY:BOOL=OFF -DUSE_VELOPACK:BOOL=OFF -DUSE_NSIS:BOOL=OFF \
            -DLL_TESTS:BOOL=OFF -DRELEASE_CRASH_REPORTING:BOOL=OFF \
            -DNON_RELEASE_CRASH_REPORTING:BOOL=OFF -DBUGSPLAT_DB:STRING=
          python scripts/ci_release_config.py "$BUILD_DIRECTORY/CMakeCache.txt" "$RUNNER_OS"
          python scripts/ci_viewer_version.py "$BUILD_DIRECTORY/newview/viewer_version.txt"

      - name: Build Release and installer
        run: cmake --build ${{ matrix.directory }} --config Release --parallel 3

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-installer
          if-no-files-found: error
          path: |
            ${{ matrix.directory }}/newview/Release/*_Setup.exe
            ${{ matrix.directory }}/newview/*.tar.xz

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-build-evidence
          path: |
            ${{ matrix.directory }}/CMakeCache.txt
            ${{ matrix.directory }}/CMakeFiles/CMakeConfigureLog.yaml
            ${{ matrix.directory }}/packages/autobuild-package.xml
            ${{ matrix.directory }}/newview/viewer_version.txt

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/Second_Life')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-installer'
          path: installers
      - uses: secondlife-3p/action-gh-release@v1
        with:
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            installers/Windows-installer/*.exe
            installers/Linux-installer/*.tar.xz
