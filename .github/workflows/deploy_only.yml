name: Deploy Viewer

on:
  workflow_dispatch:
    inputs:
      build_run_number:
        description: 'Run number of a Build viewer run with a passing CI gate'
        required: true

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            requirements.txt
            fsutils/ci.py
            fsutils/download_list.py
            fsutils/build_config.json
            fsutils/build_config.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Resolve source build run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_NUMBER: ${{ inputs.build_run_number }}
        run: python fsutils/ci.py resolve-source
      - name: Download source gate record
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          name: ci-gate-${{ steps.source.outputs.attempt }}
          path: source-gate
      - name: Require successful source builds and tests
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: python fsutils/ci.py verify-source
      - name: Download the verified artifact set
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          artifact-ids: ${{ steps.verified.outputs.artifact_ids }}
          path: downloaded-artifacts
          merge-multiple: false
      - name: Verify and stage source deliverables
        run: python fsutils/ci.py stage --gate source-gate/ci-gate.json
      - name: Install python requirements
        run: python -m pip install -r requirements.txt
      - name: Select source deployment channel and Discord hook
        env:
          FS_RELEASE_TYPE: ${{ steps.verified.outputs.release_type }}
          RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
          BETA_WEBHOOK_URL: ${{ secrets.BETA_WEBHOOK_URL }}
          NIGHTLY_WEBHOOK_URL: ${{ secrets.NIGHTLY_WEBHOOK_URL }}
          MANUAL_WEBHOOK_URL: ${{ secrets.MANUAL_WEBHOOK_URL }}
        run: python fsutils/ci.py select-hook
      - name: Reorganise artifacts ready for server upload
        env:
          FS_VIEWER_VERSION: ${{ steps.verified.outputs.version }}
          FS_VIEWER_BUILD: ${{ steps.verified.outputs.build }}
          FS_VIEWER_RELEASE_TYPE: ${{ steps.verified.outputs.release_type }}
          FS_VERSION_MGR_KEY: ${{ secrets.FS_VERSION_MGR_KEY }}
        run: python fsutils/download_list.py ./to_deploy -w "$FS_BUILD_WEBHOOK_URL"
      - name: Setup rclone
        uses: beqjanus/setup-rclone@main
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}
      - name: Copy files to remote host
        run: rclone copy ./to_deploy/${{ env.FS_RELEASE_FOLDER }} fs_r2_deploy:downloads/${{ env.FS_RELEASE_FOLDER }}
